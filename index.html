<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Modification Grist v3</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .task {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      border: 2px solid #ddd;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-todo { background: #fef3c7; }
    .btn-progress { background: #dbeafe; }
    .btn-done { background: #d1fae5; }
    .info {
      background: #eff6ff;
      padding: 15px;
      margin: 20px 0;
      border-radius: 8px;
      border: 1px solid #bfdbfe;
    }
    pre {
      background: #1e293b;
      color: #e2e8f0;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 11px;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>🧪 Test v3 : Découverte automatique</h1>
  
  <div class="info">
    <strong>Ce test va :</strong><br>
    1. Découvrir automatiquement le nom de la table<br>
    2. Tester la modification<br>
    3. Afficher tous les détails
  </div>
  
  <div id="current-task" class="task" style="display:none;">
    <h3 id="task-title">-</h3>
    <p><strong>Statut actuel :</strong> <span id="task-status">-</span></p>
    <div>
      <button class="btn-todo" onclick="changeStatus('À faire')">À faire</button>
      <button class="btn-progress" onclick="changeStatus('En cours')">En cours</button>
      <button class="btn-done" onclick="changeStatus('Terminé')">Terminé</button>
    </div>
  </div>
  
  <div id="logs">
    <h3>📋 Logs</h3>
  </div>

  <script>
    let currentRecord = null;
    let mappings = null;
    let tableId = null;
    
    function log(message, data = null) {
      const logsDiv = document.getElementById('logs');
      const time = new Date().toLocaleTimeString();
      const logEntry = document.createElement('pre');
      logEntry.textContent = `[${time}] ${message}`;
      if (data) {
        logEntry.textContent += '\n' + JSON.stringify(data, null, 2);
      }
      logsDiv.appendChild(logEntry);
      console.log(message, data);
    }
    
    grist.ready({ requiredAccess: 'full' });
    log('✅ Widget initialisé');
    
    // Récupérer l'ID de la table
    grist.onOptions(async function(options, interaction) {
      log('📦 Options reçues', { options, interaction });
      
      if (interaction && interaction.tableId) {
        tableId = interaction.tableId;
        log(`🎯 TABLE ID TROUVÉ: "${tableId}"`);
      }
      
      // Essayer aussi de lister toutes les tables
      try {
        const tables = await grist.docApi.fetchTable('_grist_Tables');
        log('📋 Tables disponibles dans le document:', tables);
      } catch (e) {
        log('⚠️ Impossible de lister les tables:', e.message);
      }
    });
    
    grist.onRecord(function(record, mappedRecord) {
      log('📍 Ligne sélectionnée');
      log('  - Record brut:', record);
      log('  - Record mappé:', mappedRecord);
      
      currentRecord = record;
      
      // Essayer de trouver le tableId depuis le record
      if (record && record._table) {
        tableId = record._table;
        log(`🎯 TABLE ID depuis record: "${tableId}"`);
      }
      
      const tache = mappedRecord.Tâche || 'Sans nom';
      const statut = mappedRecord.Statut || 'Non défini';
      
      document.getElementById('task-title').textContent = tache;
      document.getElementById('task-status').textContent = statut;
      document.getElementById('current-task').style.display = 'block';
    });
    
    grist.onRecords(function(records, recordMappings) {
      log('📊 Données chargées', { count: records.length });
      mappings = recordMappings;
      log('🗺️ Mappings:', mappings);
      
      if (records && records.length > 0 && records[0]._table) {
        tableId = records[0]._table;
        log(`🎯 TABLE ID depuis records[0]: "${tableId}"`);
      }
    });
    
    async function changeStatus(newStatus) {
      log(`\n========================================`);
      log(`🎯 TENTATIVE DE CHANGEMENT VERS: "${newStatus}"`);
      log(`========================================`);
      
      if (!currentRecord) {
        log('❌ Aucune tâche sélectionnée');
        return;
      }
      
      const rowId = currentRecord.id;
      log('🔑 Row ID:', rowId);
      log('🏷️ Table ID:', tableId);
      log('🗺️ Mappings:', mappings);
      
      if (!tableId) {
        log('❌ TABLE ID NON TROUVÉ - Impossible de continuer');
        return;
      }
      
      // Test avec le tableId trouvé
      try {
        const columnName = mappings && mappings.Statut ? mappings.Statut : 'Statut';
        
        log(`📤 Envoi de la requête UpdateRecord:`);
        log(`   - Table: "${tableId}"`);
        log(`   - Row: ${rowId}`);
        log(`   - Column: "${columnName}"`);
        log(`   - Value: "${newStatus}"`);
        
        await grist.docApi.applyUserActions([
          ['UpdateRecord', tableId, rowId, { 
            [columnName]: newStatus 
          }]
        ]);
        
        log('✅ ✅ ✅ SUCCÈS ! La modification a fonctionné ! ✅ ✅ ✅');
        
      } catch (error) {
        log('❌ ÉCHEC de la modification');
        log('Message:', error.message);
        log('Stack:', error.stack);
        
        // Fallback
        try {
          await grist.setCursorPos({ rowId });
          log('📍 Ligne ouverte pour modification manuelle');
        } catch (e) {
          log('❌ Impossible même d\'ouvrir la ligne');
        }
      }
    }
  </script>
</body>
</html>
