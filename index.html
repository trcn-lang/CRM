<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Final</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .task {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      border: 2px solid #ddd;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-todo { background: #fef3c7; }
    .btn-progress { background: #dbeafe; }
    .btn-done { background: #d1fae5; }
    .info {
      background: #eff6ff;
      padding: 15px;
      margin: 20px 0;
      border-radius: 8px;
      border: 1px solid #bfdbfe;
    }
    pre {
      background: #1e293b;
      color: #e2e8f0;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h1>🧪 Test FINAL avec getTable()</h1>
  
  <div class="info">
    <strong>Dernière tentative avec une API différente</strong>
  </div>
  
  <div id="current-task" class="task" style="display:none;">
    <h3 id="task-title">-</h3>
    <p><strong>Statut actuel :</strong> <span id="task-status">-</span></p>
    <div>
      <button class="btn-todo" onclick="changeStatus('À faire')">À faire</button>
      <button class="btn-progress" onclick="changeStatus('En cours')">En cours</button>
      <button class="btn-done" onclick="changeStatus('Terminé')">Terminé</button>
    </div>
  </div>
  
  <div id="logs">
    <h3>📋 Logs</h3>
  </div>

  <script>
    let currentRecord = null;
    let mappings = null;
    let selectedTable = null;
    
    function log(message, data = null) {
      const logsDiv = document.getElementById('logs');
      const time = new Date().toLocaleTimeString();
      const logEntry = document.createElement('pre');
      logEntry.textContent = `[${time}] ${message}`;
      if (data) {
        logEntry.textContent += '\n' + JSON.stringify(data, null, 2);
      }
      logsDiv.appendChild(logEntry);
      console.log(message, data);
    }
    
    grist.ready({ requiredAccess: 'full' });
    log('✅ Widget initialisé');
    
    // Récupérer la table sélectionnée
    grist.getTable().then(table => {
      selectedTable = table;
      log('🎯 Table obtenue via grist.getTable():', table);
    }).catch(err => {
      log('❌ Erreur getTable():', err);
    });
    
    grist.onRecord(function(record, mappedRecord) {
      log('📍 Ligne sélectionnée', { record, mappedRecord });
      currentRecord = record;
      
      const tache = record.Tache || 'Sans nom';
      const statut = record.Statut ? record.Statut[0] : 'Non défini';
      
      document.getElementById('task-title').textContent = tache;
      document.getElementById('task-status').textContent = statut;
      document.getElementById('current-task').style.display = 'block';
    });
    
    grist.onRecords(function(records, recordMappings) {
      log('📊 Données chargées', { count: records.length, mappings: recordMappings });
      mappings = recordMappings;
    });
    
    async function changeStatus(newStatus) {
      log(`\n🎯 CHANGEMENT VERS: "${newStatus}"`);
      
      if (!currentRecord) {
        log('❌ Aucune tâche sélectionnée');
        return;
      }
      
      const rowId = currentRecord.id;
      log('Row ID:', rowId);
      log('Table:', selectedTable);
      
      // Méthode avec selectedTable.update()
      if (selectedTable) {
        try {
          log('🔄 Tentative avec selectedTable.update()');
          
          const columnName = mappings && mappings.Statut ? mappings.Statut : 'Statut';
          log(`Colonne: "${columnName}"`);
          
          await selectedTable.update({
            id: rowId,
            [columnName]: newStatus
          });
          
          log('✅ ✅ ✅ SUCCÈS ! ✅ ✅ ✅');
          return;
          
        } catch (error) {
          log('❌ Échec selectedTable.update():', { message: error.message, stack: error.stack });
        }
      }
      
      // Fallback
      try {
        await grist.setCursorPos({ rowId });
        log('📍 Ligne ouverte pour modification manuelle');
      } catch (e) {
        log('❌ Échec total');
      }
    }
  </script>
</body>
</html>
