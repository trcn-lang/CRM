<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Modification Grist</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .task {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      border: 2px solid #ddd;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-todo { background: #fef3c7; }
    .btn-progress { background: #dbeafe; }
    .btn-done { background: #d1fae5; }
    .info {
      background: #eff6ff;
      padding: 15px;
      margin: 20px 0;
      border-radius: 8px;
      border: 1px solid #bfdbfe;
    }
    pre {
      background: #1e293b;
      color: #e2e8f0;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>🧪 Test de modification Grist</h1>
  
  <div class="info">
    <strong>Instructions :</strong><br>
    1. Sélectionnez une tâche dans le tableau ci-dessous<br>
    2. Cliquez sur un bouton de statut<br>
    3. Regardez les logs pour voir ce qui se passe
  </div>
  
  <div id="current-task" class="task" style="display:none;">
    <h3 id="task-title">-</h3>
    <p><strong>Statut actuel :</strong> <span id="task-status">-</span></p>
    <div>
      <button class="btn-todo" onclick="changeStatus('À faire')">À faire</button>
      <button class="btn-progress" onclick="changeStatus('En cours')">En cours</button>
      <button class="btn-done" onclick="changeStatus('Terminé')">Terminé</button>
    </div>
  </div>
  
  <div id="logs">
    <h3>📋 Logs de débogage</h3>
  </div>

  <script>
    let currentRecord = null;
    let mappings = null;
    let allRecords = [];
    
    function log(message, data = null) {
      const logsDiv = document.getElementById('logs');
      const time = new Date().toLocaleTimeString();
      const logEntry = document.createElement('pre');
      logEntry.textContent = `[${time}] ${message}`;
      if (data) {
        logEntry.textContent += '\n' + JSON.stringify(data, null, 2);
      }
      logsDiv.appendChild(logEntry);
      console.log(message, data);
    }
    
    // Initialisation
    grist.ready({
      requiredAccess: 'full',
      columns: [
        { name: 'Tâche', optional: false },
        { name: 'Statut', optional: false }
      ]
    });
    
    log('✅ Widget initialisé');
    
    // Écouter les changements de sélection
    grist.onRecord(function(record, mappedRecord) {
      log('📍 Ligne sélectionnée', { record, mappedRecord });
      currentRecord = record;
      
      const tache = mappedRecord.Tâche || 'Sans nom';
      const statut = mappedRecord.Statut || 'Non défini';
      
      document.getElementById('task-title').textContent = tache;
      document.getElementById('task-status').textContent = statut;
      document.getElementById('current-task').style.display = 'block';
    });
    
    // Charger toutes les données
    grist.onRecords(function(records, recordMappings) {
      log('📊 Données chargées', { 
        count: records.length,
        mappings: recordMappings 
      });
      allRecords = records;
      mappings = recordMappings;
    });
    
    // FONCTION CRITIQUE : Changer le statut
    async function changeStatus(newStatus) {
      log(`🎯 Tentative de changement vers: ${newStatus}`);
      
      if (!currentRecord) {
        log('❌ Aucune tâche sélectionnée');
        return;
      }
      
      const rowId = currentRecord.id;
      log('🔑 Row ID:', rowId);
      log('🗺️ Mappings disponibles:', mappings);
      
      // Méthode 1 : Via docApi.applyUserActions - TESTER TOUS LES NOMS
      try {
        log('🔄 Essai Méthode 1: docApi.applyUserActions');
        
        // TESTER DIFFÉRENTS NOMS
        const possibleNames = [
          '4. Tâches',
          '4.Tâches',
          '4. Taches',
          '4.Taches',
          'Tâches',
          'Taches',
          '4_Tâches',
          '4_Taches'
        ];
        
        for (const tableName of possibleNames) {
          try {
            const columnName = mappings && mappings.Statut ? mappings.Statut : 'Statut';
            
            log(`🧪 Test avec nom: "${tableName}"`);
            
            await grist.docApi.applyUserActions([
              ['UpdateRecord', tableName, rowId, { 
                [columnName]: newStatus 
              }]
            ]);
            
            log(`✅ ✅ ✅ SUCCÈS avec le nom: "${tableName}" ✅ ✅ ✅`);
            return;
            
          } catch (e) {
            log(`❌ Échec avec "${tableName}": ${e.message}`);
          }
        }
        
        log('❌ Toutes les variantes ont échoué');
        
      } catch (error) {
        log('❌ Erreur générale:', error);
      }
      
      // Méthode 2 : Via setCursorPos (fallback)
      try {
        log('🔄 Essai Méthode 2: setCursorPos (manuel)');
        await grist.setCursorPos({ rowId });
        log('✅ Ligne ouverte. Changez manuellement le statut à: ' + newStatus);
      } catch (error) {
        log('❌ Méthode 2 échouée:', error);
      }
    }
  </script>
</body>
</html>
